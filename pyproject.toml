[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "termigent"
dynamic = ["version"]
description = "Universal MCP server that exposes a system terminal over SSE."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fortune" }]
keywords = ["mcp", "model-context-protocol", "sse", "terminal", "shell", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Shells",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/Re4lLife/Termigent"
Repository = "https://github.com/Re4lLife/Termigent"
Issues = "https://github.com/Re4lLife/Termigent/issues"

[project.scripts]
termigent = "termigent.cli:main"

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
include = ["termigent*"]
